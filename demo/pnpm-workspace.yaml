# Allow Next.js's `sharp` to run its build script, so `pnpm install` isn't blocked by pnpm's
# ignored-builds guard. (The demo uses a plain <img>, not next/image, so sharp is otherwise inert.)
# Two keys for cross-version compatibility: pnpm 11 reads `allowBuilds`, pnpm 10 `onlyBuiltDependencies`.
allowBuilds:
  sharp: true
onlyBuiltDependencies:
  - sharp
